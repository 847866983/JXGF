appId: com.jingxu.studio
productName: 镜序工坊
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
# MCP 服务器单独放到 resources/mcp/ 下，供 AI 客户端以 node 子进程直接运行（asar 内无法直接执行）
extraResources:
  - from: out/mcp
    to: mcp
    filter:
      - '**/*'
  # 内置 H3 技能（forest-laoli-h3），供内置 AI 助手与 MCP 读取
  - from: skills
    to: skills
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 本机无符号链接权限时 winCodeSign 解压会失败；已通过手动解压 winCodeSign-2.6.0 到缓存绕过。
  # 若在无该缓存的机器上打包失败，见 docs/发布与校验流程.md。
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 镜序工坊
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  provider: github
  owner: '847866983'
  repo: 'JXGF'
  releaseType: release
