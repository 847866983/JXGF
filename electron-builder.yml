appId: com.jingxu.studio
productName: 镜序工坊
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
# MCP 服务器单独放到 resources/mcp/ 下，供 AI 客户端以 node 子进程直接运行（asar 内无法直接执行）
extraResources:
  - from: out/mcp
    to: mcp
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 本开发环境无符号链接权限（winCodeSign 解压需要），临时关闭 exe 元数据编辑。
  # 正式发布在开启开发者模式/管理员权限的机器上打包时，可删掉这一行恢复图标与版本信息嵌入。
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 镜序工坊
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  provider: github
  owner: frameforge-studio
  repo: frameforge
  releaseType: release
