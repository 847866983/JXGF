appId: com.jingxu.studio
productName: 镜序工坊
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
# MCP 服务器单独放到 resources/mcp/ 下，供 AI 客户端以 node 子进程直接运行（asar 内无法直接执行）
extraResources:
  - from: out/mcp
    to: mcp
    filter:
      - '**/*'
  # 内置 H3 技能（forest-laoli-h3），供内置 AI 助手与 MCP 读取
  - from: skills
    to: skills
    filter:
      - '**/*'
  # 内置解压工具 7za.exe，供「一键安装 ComfyUI」解压便携版
  - from: resources/tools
    to: tools
    filter:
      - '**/*'
  # 内置 BanZhang 自定义节点包，安装 ComfyUI 后自动解压到 custom_nodes
  - from: resources/comfy-nodes
    to: comfy-nodes
    filter:
      - '**/*'
  # 内置图片/视频工作流，随软件分发，打开/新建项目时自动注入
  - from: resources/workflows
    to: workflows
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 本机无符号链接权限时 winCodeSign 解压会失败；已通过手动解压 winCodeSign-2.6.0 到缓存绕过。
  # 若在无该缓存的机器上打包失败，见 docs/发布与校验流程.md。
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 镜序工坊
  # 强制简体中文安装向导（不跟随系统语言），在任何电脑上都显示中文
  installerLanguages:
    - zh_CN
  language: '2052'
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  provider: github
  owner: '847866983'
  repo: 'JXGF'
  releaseType: release
